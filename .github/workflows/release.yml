name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release when package version is pending
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid package version: ${VERSION}"
            exit 1
          fi

          TAG="v${VERSION}"
          PREVIOUS_VERSION=""
          if git cat-file -e "${GITHUB_EVENT_BEFORE}:package.json" 2>/dev/null; then
            PREVIOUS_VERSION="$(git show "${GITHUB_EVENT_BEFORE}:package.json" | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)"
          fi

          if [ -n "${PREVIOUS_VERSION}" ] && [ "${PREVIOUS_VERSION}" = "${VERSION}" ] && git rev-parse "${TAG}^{commit}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-parse "${TAG}^{commit}")"
            if [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already exists on ${TAG_SHA}; skipping release."
              exit 0
            fi
          fi
          LATEST_TAG="$(git tag -l 'v[0-9]*' --sort=-version:refname | head -1)"

          if [ -n "${LATEST_TAG}" ] && [ "${LATEST_TAG}" != "${TAG}" ]; then
            LOWEST="$(printf '%s\n' "${LATEST_TAG#v}" "${VERSION}" | sort -V | head -1)"
            if [ "${LOWEST}" != "${LATEST_TAG#v}" ]; then
              echo "::error::${VERSION} is older than the latest release ${LATEST_TAG}."
              exit 1
            fi
          fi

          if git rev-parse "${TAG}^{commit}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-parse "${TAG}^{commit}")"
            if [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "::error::Tag ${TAG} points to ${TAG_SHA}, expected ${GITHUB_SHA}."
              exit 1
            fi

            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists."
              exit 0
            fi

            echo "Tag ${TAG} exists without a GitHub Release; recovering it."
          elif [ -n "${LATEST_TAG}" ] && [ "${LATEST_TAG}" = "${TAG}" ]; then
            echo "::error::Latest tag ${TAG} was not found locally."
            exit 1
          else
            echo "Release ${TAG} is pending."
          fi

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes
